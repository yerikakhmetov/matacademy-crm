# Автотесты денег, зарплаты, прайса и тестов учеников на каждый push.
# Деплой на Vercel не блокируют: результат виден в GitHub рядом с коммитом.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
